name: iOS Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Shared iOS Framework
        run: ./gradlew :shared:assembleXCFramework

      - name: Build iOS App
        run: |
          cd iosApp
          xcodebuild -scheme iosApp -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED=NO
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: GenGhealth-iOS
          path: iosApp/build/Release-iphoneos/iosApp.app
